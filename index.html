<!DOCTYPE html>
<html>
<head>
    <title>Prediction App</title>
</head>
<body>

<h2>Enter Values</h2>

<input id="f1" placeholder="Feature 1"><br>
<input id="f2" placeholder="Feature 2"><br>
<input id="f3" placeholder="Feature 3"><br>
<input id="f4" placeholder="Feature 4"><br>
<input id="f5" placeholder="Feature 5"><br>

<button onclick="predict()">Predict</button>

<p id="result"></p>

<script>
function predict() {
    const features = [
        Number(f1.value),
        Number(f2.value),
        Number(f3.value),
        Number(f4.value),
        Number(f5.value)
    ];

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({features})
    })
    .then(res => res.json())
    .then(data => {
        result.innerText = "Prediction: " + data.prediction;
    });
}
</script>

</body>
</html>
