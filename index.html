<!DOCTYPE html>
<html>
<head>
    <title>Logistic Regression Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
        }
        button {
            padding: 10px 25px;
            background: green;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>ML Prediction App</h2>

<!-- CHANGE NUMBER OF INPUTS BASED ON YOUR MODEL -->
<input type="number" id="f1" placeholder="Feature 1"><br>
<input type="number" id="f2" placeholder="Feature 2"><br>
<input type="number" id="f3" placeholder="Feature 3"><br>
<input type="number" id="f4" placeholder="Feature 4"><br>
<input type="number" id="f5" placeholder="Feature 5"><br>

<br>
<button onclick="predict()">Predict</button>

<div id="result"></div>

<script>
function predict() {
    const features = [
        Number(document.getElementById("f1").value),
        Number(document.getElementById("f2").value),
        Number(document.getElementById("f3").value),
        Number(document.getElementById("f4").value),
        Number(document.getElementById("f5").value)
    ];

    fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ features: features })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            `<b>Prediction:</b> ${data.prediction}<br>
             <b>Probability:</b> ${data.probability}`;
    })
    .catch(error => {
        document.getElementById("result").innerHTML = "Error occurred";
    });
}
</script>

</body>
</html>
