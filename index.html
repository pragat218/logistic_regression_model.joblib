<!DOCTYPE html>
<html>
<head>
    <title>ML Prediction</title>
</head>
<body>

<h2>Enter 8 Feature Values</h2>

<input id="f1" placeholder="Feature 1"><br>
<input id="f2" placeholder="Feature 2"><br>
<input id="f3" placeholder="Feature 3"><br>
<input id="f4" placeholder="Feature 4"><br>
<input id="f5" placeholder="Feature 5"><br>
<input id="f6" placeholder="Feature 6"><br>
<input id="f7" placeholder="Feature 7"><br>
<input id="f8" placeholder="Feature 8"><br>

<br>
<button onclick="predict()">Predict</button>

<p id="result"></p>

<script>
function predict() {
    const features = [
        Number(f1.value),
        Number(f2.value),
        Number(f3.value),
        Number(f4.value),
        Number(f5.value),
        Number(f6.value),
        Number(f7.value),
        Number(f8.value)
    ];

    fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ features: features })
    })
    .then(res => res.json())
    .then(data => {
        result.innerText = "Prediction: " + data.prediction;
    })
    .catch(() => {
        result.innerText = "Error occurred";
    });
}
</script>

</body>
</html>
